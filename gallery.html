<section class="gallery-hero">

    <h1>Gallery</h1>

    <p>

        Stories of culture, nature and imagination, told through paintings and illustrations.

    </p>

</section>
<div class="gallery-filter" id="gallery-filter" role="group" aria-label="Filter artworks by theme">
</div>

<section class="gallery-page">

<!-- Cards are rendered by js/gallery.js from a single artworks array.
     Do NOT hardcode .art-card markup here — that previously caused every
     artwork to render twice (once from this HTML, once from the script). -->
<div id="gallery-grid"></div>

</section>

<div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" aria-hidden="true">

    <button id="close" aria-label="Close">&times;</button>

    <button id="prev" aria-label="Previous artwork">&#10094;</button>

    <div class="lightbox-view">
    <img id="lightbox-img" alt="">

    <div class="lightbox-info">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-desc"></p>
    </div>

    </div>

    <button id="next" aria-label="Next artwork">&#10095;</button>

</div>
